<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Three jobs. A clear process for each.</title><desc id="desc">Your agent does the work. The state machine keeps checks, revisions, and waits explicit.</desc>
<style>text{font-family:Inter,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="1198" height="598" rx="22" fill="#f5f8f8" stroke="#d9e3e6"/>
<text x="40" y="43" font-size="13" fill="#147d70" font-weight="700" letter-spacing="1.5">DECOUPLEFLOW  /  USE CASES</text>
<text x="40" y="95" font-size="32" fill="#172c38" font-weight="700" >Three jobs. A clear process for each.</text>
<text x="40" y="133" font-size="18" fill="#5e727e" font-weight="400" >Your agent does the work. The state machine keeps checks, revisions, and waits explicit.</text>
<rect x="40" y="172" width="364" height="354" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="40" y="172" width="364" height="7" rx="3" fill="#147d70" stroke="none"/><text x="62" y="211" font-size="13" fill="#147d70" font-weight="700" letter-spacing="0.6">01  /  BUGFIX</text><text x="62" y="254" font-size="24" fill="#172c38" font-weight="700" >Fix it. Then prove it.</text><text x="62" y="288" font-size="17" fill="#5e727e" font-weight="400" >IN  A cart with the wrong total</text><rect x="62" y="323" width="100" height="42" rx="9" fill="#e7f5ef" stroke="none"/><text x="112" y="350" font-size="14" fill="#147d70" font-weight="600" text-anchor="middle">Reproduce</text><path d="M163 344H164" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M159 339l5 5-5 5" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="170" y="323" width="100" height="42" rx="9" fill="#e7f5ef" stroke="none"/><text x="220" y="350" font-size="14" fill="#147d70" font-weight="600" text-anchor="middle">Fix</text><path d="M271 344H272" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M267 339l5 5-5 5" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="278" y="323" width="100" height="42" rx="9" fill="#e7f5ef" stroke="none"/><text x="328" y="350" font-size="14" fill="#147d70" font-weight="600" text-anchor="middle">Verify</text><path d="M326 376v14H218v-9" fill="none" stroke="#147d70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="222" y="414" font-size="14" fill="#147d70" font-weight="500" text-anchor="middle">Failed test → back to fix</text><path d="M62 438h320" fill="none" stroke="#d9e3e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="62" y="469" font-size="16" fill="#172c38" font-weight="500" >OUT  A patch + regression evidence</text><text x="62" y="499" font-size="16" fill="#172c38" font-weight="500" >VALUE  Tests pass before delivery</text><rect x="418" y="172" width="364" height="354" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="418" y="172" width="364" height="7" rx="3" fill="#386db8" stroke="none"/><text x="440" y="211" font-size="13" fill="#386db8" font-weight="700" letter-spacing="0.6">02  /  RESEARCH</text><text x="440" y="254" font-size="24" fill="#172c38" font-weight="700" >Every claim has a source.</text><text x="440" y="288" font-size="17" fill="#5e727e" font-weight="400" >IN  Three sources + a clear brief</text><rect x="440" y="323" width="100" height="42" rx="9" fill="#eaf1fc" stroke="none"/><text x="490" y="350" font-size="14" fill="#386db8" font-weight="600" text-anchor="middle">Read each</text><path d="M541 344H542" fill="none" stroke="#386db8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M537 339l5 5-5 5" fill="none" stroke="#386db8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="548" y="323" width="100" height="42" rx="9" fill="#eaf1fc" stroke="none"/><text x="598" y="350" font-size="14" fill="#386db8" font-weight="600" text-anchor="middle">Draft</text><path d="M649 344H650" fill="none" stroke="#386db8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M645 339l5 5-5 5" fill="none" stroke="#386db8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="656" y="323" width="100" height="42" rx="9" fill="#eaf1fc" stroke="none"/><text x="706" y="350" font-size="14" fill="#386db8" font-weight="600" text-anchor="middle">Review</text><path d="M704 376v14H596v-9" fill="none" stroke="#386db8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="600" y="414" font-size="14" fill="#386db8" font-weight="500" text-anchor="middle">Missing evidence → revise</text><path d="M440 438h320" fill="none" stroke="#d9e3e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="440" y="469" font-size="16" fill="#172c38" font-weight="500" >OUT  Comparison, sources, unknowns</text><text x="440" y="499" font-size="16" fill="#172c38" font-weight="500" >VALUE  Facts stay separate from guesses</text><rect x="796" y="172" width="364" height="354" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="796" y="172" width="364" height="7" rx="3" fill="#7960b4" stroke="none"/><text x="818" y="211" font-size="13" fill="#7960b4" font-weight="700" letter-spacing="0.6">03  /  RELEASE</text><text x="818" y="254" font-size="24" fill="#172c38" font-weight="700" >Wait for the right signal.</text><text x="818" y="288" font-size="17" fill="#5e727e" font-weight="400" >IN  A candidate + a checklist</text><rect x="818" y="323" width="100" height="42" rx="9" fill="#f0ecf8" stroke="none"/><text x="868" y="350" font-size="14" fill="#7960b4" font-weight="600" text-anchor="middle">Checklist</text><path d="M919 344H920" fill="none" stroke="#7960b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M915 339l5 5-5 5" fill="none" stroke="#7960b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="926" y="323" width="100" height="42" rx="9" fill="#f0ecf8" stroke="none"/><text x="976" y="350" font-size="14" fill="#7960b4" font-weight="600" text-anchor="middle">CI result</text><path d="M1027 344H1028" fill="none" stroke="#7960b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M1023 339l5 5-5 5" fill="none" stroke="#7960b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1034" y="323" width="100" height="42" rx="9" fill="#f0ecf8" stroke="none"/><text x="1084" y="350" font-size="14" fill="#7960b4" font-weight="600" text-anchor="middle">Approval</text><path d="M1082 376v14H974v-9" fill="none" stroke="#7960b4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="978" y="414" font-size="14" fill="#7960b4" font-weight="500" text-anchor="middle">Close → resume the same instance</text><path d="M818 438h320" fill="none" stroke="#d9e3e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="818" y="469" font-size="16" fill="#172c38" font-weight="500" >OUT  A record of release readiness</text><text x="818" y="499" font-size="16" fill="#172c38" font-weight="500" >VALUE  Every required check is covered</text><circle cx="53" cy="561" r="11" fill="#e7f5ef"/><path d="M48 561l3 3 6-7" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="567" font-size="18" fill="#5e727e" font-weight="400" >Pick a demo in New machine · Sample inputs and Skills included · Offline walkthroughs need no API key</text>
</svg>
