<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">三个具体任务，一眼看懂用在哪里。</title><desc id="desc">Agent 自己完成工作；状态机让检查、返工和等待有据可循。</desc>
<style>text{font-family:Inter,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="1198" height="598" rx="22" fill="#f5f8f8" stroke="#d9e3e6"/>
<text x="40" y="43" font-size="13" fill="#147d70" font-weight="700" letter-spacing="1.5">DECOUPLEFLOW  /  用途示意</text>
<text x="40" y="95" font-size="32" fill="#172c38" font-weight="700" >三个具体任务，一眼看懂用在哪里。</text>
<text x="40" y="133" font-size="18" fill="#5e727e" font-weight="400" >Agent 自己完成工作；状态机让检查、返工和等待有据可循。</text>
<rect x="40" y="172" width="364" height="354" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="40" y="172" width="364" height="7" rx="3" fill="#147d70" stroke="none"/><text x="62" y="211" font-size="13" fill="#147d70" font-weight="700" letter-spacing="0.6">01  /  修复 BUG</text><text x="62" y="254" font-size="25" fill="#172c38" font-weight="700" >修好，还要验证好</text><text x="62" y="288" font-size="17" fill="#5e727e" font-weight="400" >输入：购物车金额计算错误</text><rect x="62" y="323" width="100" height="42" rx="9" fill="#e7f5ef" stroke="none"/><text x="112" y="350" font-size="14" fill="#147d70" font-weight="600" text-anchor="middle">复现</text><path d="M163 344H164" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M159 339l5 5-5 5" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="170" y="323" width="100" height="42" rx="9" fill="#e7f5ef" stroke="none"/><text x="220" y="350" font-size="14" fill="#147d70" font-weight="600" text-anchor="middle">修复</text><path d="M271 344H272" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M267 339l5 5-5 5" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="278" y="323" width="100" height="42" rx="9" fill="#e7f5ef" stroke="none"/><text x="328" y="350" font-size="14" fill="#147d70" font-weight="600" text-anchor="middle">验证</text><path d="M326 376v14H218v-9" fill="none" stroke="#147d70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="222" y="414" font-size="16" fill="#147d70" font-weight="500" text-anchor="middle">失败 → 回到修复</text><path d="M62 438h320" fill="none" stroke="#d9e3e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="62" y="469" font-size="18" fill="#172c38" font-weight="500" >交付：最小补丁 + 回归记录</text><text x="62" y="499" font-size="18" fill="#172c38" font-weight="500" >可见价值：测试通过才交付</text><rect x="418" y="172" width="364" height="354" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="418" y="172" width="364" height="7" rx="3" fill="#386db8" stroke="none"/><text x="440" y="211" font-size="13" fill="#386db8" font-weight="700" letter-spacing="0.6">02  /  选型简报</text><text x="440" y="254" font-size="25" fill="#172c38" font-weight="700" >每个结论都有出处</text><text x="440" y="288" font-size="17" fill="#5e727e" font-weight="400" >输入：三份资料 + 选型要求</text><rect x="440" y="323" width="100" height="42" rx="9" fill="#eaf1fc" stroke="none"/><text x="490" y="350" font-size="14" fill="#386db8" font-weight="600" text-anchor="middle">逐份阅读</text><path d="M541 344H542" fill="none" stroke="#386db8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M537 339l5 5-5 5" fill="none" stroke="#386db8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="548" y="323" width="100" height="42" rx="9" fill="#eaf1fc" stroke="none"/><text x="598" y="350" font-size="14" fill="#386db8" font-weight="600" text-anchor="middle">撰写</text><path d="M649 344H650" fill="none" stroke="#386db8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M645 339l5 5-5 5" fill="none" stroke="#386db8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="656" y="323" width="100" height="42" rx="9" fill="#eaf1fc" stroke="none"/><text x="706" y="350" font-size="14" fill="#386db8" font-weight="600" text-anchor="middle">审查</text><path d="M704 376v14H596v-9" fill="none" stroke="#386db8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="600" y="414" font-size="16" fill="#386db8" font-weight="500" text-anchor="middle">依据不足 → 修订</text><path d="M440 438h320" fill="none" stroke="#d9e3e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="440" y="469" font-size="18" fill="#172c38" font-weight="500" >交付：对比表 + 来源 + 未知项</text><text x="440" y="499" font-size="18" fill="#172c38" font-weight="500" >可见价值：不把猜测当成事实</text><rect x="796" y="172" width="364" height="354" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="796" y="172" width="364" height="7" rx="3" fill="#7960b4" stroke="none"/><text x="818" y="211" font-size="13" fill="#7960b4" font-weight="700" letter-spacing="0.6">03  /  发布验收</text><text x="818" y="254" font-size="25" fill="#172c38" font-weight="700" >该等的时候，先等</text><text x="818" y="288" font-size="17" fill="#5e727e" font-weight="400" >输入：候选版本 + 验收清单</text><rect x="818" y="323" width="100" height="42" rx="9" fill="#f0ecf8" stroke="none"/><text x="868" y="350" font-size="14" fill="#7960b4" font-weight="600" text-anchor="middle">逐项检查</text><path d="M919 344H920" fill="none" stroke="#7960b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M915 339l5 5-5 5" fill="none" stroke="#7960b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="926" y="323" width="100" height="42" rx="9" fill="#f0ecf8" stroke="none"/><text x="976" y="350" font-size="14" fill="#7960b4" font-weight="600" text-anchor="middle">等待 CI</text><path d="M1027 344H1028" fill="none" stroke="#7960b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M1023 339l5 5-5 5" fill="none" stroke="#7960b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1034" y="323" width="100" height="42" rx="9" fill="#f0ecf8" stroke="none"/><text x="1084" y="350" font-size="14" fill="#7960b4" font-weight="600" text-anchor="middle">人工批准</text><path d="M1082 376v14H974v-9" fill="none" stroke="#7960b4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="978" y="414" font-size="16" fill="#7960b4" font-weight="500" text-anchor="middle">关闭 → 恢复原实例</text><path d="M818 438h320" fill="none" stroke="#d9e3e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="818" y="469" font-size="18" fill="#172c38" font-weight="500" >交付：可发布记录，保留决定权</text><text x="818" y="499" font-size="18" fill="#172c38" font-weight="500" >可见价值：逐项过关，不漏检查</text><circle cx="53" cy="561" r="11" fill="#e7f5ef"/><path d="M48 561l3 3 6-7" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="567" font-size="18" fill="#5e727e" font-weight="400" >在「新建状态机」直接选择 · 示例输入与 Skill 已备好 · 也可无 API 离线演练</text>
</svg>
