<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="586" viewBox="0 0 1200 586" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Design it. Take it with you. Keep going.</title><desc id="desc">DecoupleFlow is independent of the agent. The agent uses the Skill to maintain process state.</desc>
<style>text{font-family:Inter,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="1198" height="584" rx="22" fill="#f5f8f8" stroke="#d9e3e6"/>
<text x="40" y="43" font-size="13" fill="#147d70" font-weight="700" letter-spacing="1.5">DECOUPLEFLOW  /  WORKFLOW</text>
<text x="40" y="95" font-size="32" fill="#172c38" font-weight="700" >Design it. Take it with you. Keep going.</text>
<text x="40" y="133" font-size="18" fill="#5e727e" font-weight="400" >DecoupleFlow is independent of the agent. The agent uses the Skill to maintain process state.</text>
<rect x="40" y="176" width="268" height="218" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="60" y="194" width="45" height="30" rx="15" fill="#e7f5ef" stroke="none"/><text x="82.5" y="214" font-size="13" fill="#147d70" font-weight="650" text-anchor="middle">01</text><text x="60" y="259" font-size="22" fill="#172c38" font-weight="700" >Draw the process</text><text x="60" y="294" font-size="16" fill="#5e727e" font-weight="400" >States, routes, quality gates</text><text x="60" y="320" font-size="16" fill="#5e727e" font-weight="400" >Checklists, loops, and waits</text><text x="60" y="369" font-size="15" fill="#147d70" font-weight="600" >Visual editor</text><path d="M311 281H316" fill="none" stroke="#5e727e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M311 276l5 5-5 5" fill="none" stroke="#5e727e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="324" y="176" width="268" height="218" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="344" y="194" width="45" height="30" rx="15" fill="#e7f5ef" stroke="none"/><text x="366.5" y="214" font-size="13" fill="#147d70" font-weight="650" text-anchor="middle">02</text><text x="344" y="259" font-size="22" fill="#172c38" font-weight="700" >Export a Skill</text><text x="344" y="294" font-size="16" fill="#5e727e" font-weight="400" >Markdown + Mermaid</text><text x="344" y="320" font-size="16" fill="#5e727e" font-weight="400" >A portable state module</text><text x="344" y="369" font-size="15" fill="#147d70" font-weight="600" >Ordinary files</text><path d="M595 281H600" fill="none" stroke="#5e727e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M595 276l5 5-5 5" fill="none" stroke="#5e727e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="608" y="176" width="268" height="218" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="628" y="194" width="45" height="30" rx="15" fill="#e7f5ef" stroke="none"/><text x="650.5" y="214" font-size="13" fill="#147d70" font-weight="650" text-anchor="middle">03</text><text x="628" y="259" font-size="22" fill="#172c38" font-weight="700" >Use your agent</text><text x="628" y="294" font-size="16" fill="#5e727e" font-weight="400" >It reads context, uses tools,</text><text x="628" y="320" font-size="16" fill="#5e727e" font-weight="400" >and submits work evidence</text><text x="628" y="369" font-size="15" fill="#147d70" font-weight="600" >It chooses how to work</text><path d="M879 281H884" fill="none" stroke="#5e727e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M879 276l5 5-5 5" fill="none" stroke="#5e727e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="892" y="176" width="268" height="218" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="912" y="194" width="45" height="30" rx="15" fill="#e7f5ef" stroke="none"/><text x="934.5" y="214" font-size="13" fill="#147d70" font-weight="650" text-anchor="middle">04</text><text x="912" y="259" font-size="22" fill="#172c38" font-weight="700" >Record progress</text><text x="912" y="294" font-size="16" fill="#5e727e" font-weight="400" >Validate the host decision</text><text x="912" y="320" font-size="16" fill="#5e727e" font-weight="400" >Save state; hand off next step</text><text x="912" y="369" font-size="15" fill="#147d70" font-weight="600" >Visible and resumable</text><path d="M1026 400v35H742v-35" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M737 406l5-6 5 6" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="775" y="416" width="220" height="30" rx="0" fill="#f5f8f8" stroke="none"/><text x="885" y="437" font-size="15" fill="#147d70" font-weight="600" text-anchor="middle">Conditions met → next state</text><rect x="40" y="417" width="494" height="30" rx="15" fill="#fff0db" stroke="none"/><text x="287" y="437" font-size="13" fill="#ae691b" font-weight="650" text-anchor="middle">Incomplete evidence / pending external result → hold</text><rect x="40" y="473" width="1120" height="84" rx="14" fill="#172c38" stroke="none"/><text x="65" y="508" font-size="21" fill="#fff" font-weight="650" >Close the agent. Keep the progress.</text><text x="65" y="536" font-size="17" fill="#c6d9df" font-weight="400" >The task workspace keeps the checkpoint, current checklist item, and pending external job.</text>
</svg>
