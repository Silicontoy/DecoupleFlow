<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="586" viewBox="0 0 1200 586" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">设计 → 带走 → 使用 → 继续。</title><desc id="desc">DecoupleFlow 独立于 Agent；它描述过程，Agent 用 Skill 维护过程状态。</desc>
<style>text{font-family:Inter,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="1198" height="584" rx="22" fill="#f5f8f8" stroke="#d9e3e6"/>
<text x="40" y="43" font-size="13" fill="#147d70" font-weight="700" letter-spacing="1.5">DECOUPLEFLOW  /  使用流程</text>
<text x="40" y="95" font-size="32" fill="#172c38" font-weight="700" >设计 → 带走 → 使用 → 继续。</text>
<text x="40" y="133" font-size="18" fill="#5e727e" font-weight="400" >DecoupleFlow 独立于 Agent；它描述过程，Agent 用 Skill 维护过程状态。</text>
<rect x="40" y="176" width="268" height="218" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="60" y="194" width="45" height="30" rx="15" fill="#e7f5ef" stroke="none"/><text x="82.5" y="214" font-size="13" fill="#147d70" font-weight="650" text-anchor="middle">01</text><text x="60" y="259" font-size="24" fill="#172c38" font-weight="700" >画出过程</text><text x="60" y="294" font-size="17" fill="#5e727e" font-weight="400" >状态、路径与质量条件</text><text x="60" y="320" font-size="17" fill="#5e727e" font-weight="400" >列表、循环与外部等待</text><text x="60" y="369" font-size="15" fill="#147d70" font-weight="600" >可视化编辑器</text><path d="M311 281H316" fill="none" stroke="#5e727e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M311 276l5 5-5 5" fill="none" stroke="#5e727e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="324" y="176" width="268" height="218" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="344" y="194" width="45" height="30" rx="15" fill="#e7f5ef" stroke="none"/><text x="366.5" y="214" font-size="13" fill="#147d70" font-weight="650" text-anchor="middle">02</text><text x="344" y="259" font-size="24" fill="#172c38" font-weight="700" >导出 Skill</text><text x="344" y="294" font-size="17" fill="#5e727e" font-weight="400" >可读 Markdown + Mermaid</text><text x="344" y="320" font-size="17" fill="#5e727e" font-weight="400" >可独立使用的状态机模块</text><text x="344" y="369" font-size="15" fill="#147d70" font-weight="600" >可移植文件</text><path d="M595 281H600" fill="none" stroke="#5e727e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M595 276l5 5-5 5" fill="none" stroke="#5e727e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="608" y="176" width="268" height="218" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="628" y="194" width="45" height="30" rx="15" fill="#e7f5ef" stroke="none"/><text x="650.5" y="214" font-size="13" fill="#147d70" font-weight="650" text-anchor="middle">03</text><text x="628" y="259" font-size="24" fill="#172c38" font-weight="700" >交给现有 Agent</text><text x="628" y="294" font-size="17" fill="#5e727e" font-weight="400" >自主读取上下文、调用工具</text><text x="628" y="320" font-size="17" fill="#5e727e" font-weight="400" >做完当前工作后提交证据</text><text x="628" y="369" font-size="15" fill="#147d70" font-weight="600" >工作方式由它决定</text><path d="M879 281H884" fill="none" stroke="#5e727e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M879 276l5 5-5 5" fill="none" stroke="#5e727e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="892" y="176" width="268" height="218" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="912" y="194" width="45" height="30" rx="15" fill="#e7f5ef" stroke="none"/><text x="934.5" y="214" font-size="13" fill="#147d70" font-weight="650" text-anchor="middle">04</text><text x="912" y="259" font-size="24" fill="#172c38" font-weight="700" >记录状态跳转</text><text x="912" y="294" font-size="17" fill="#5e727e" font-weight="400" >检查宿主提交的决策与条件</text><text x="912" y="320" font-size="17" fill="#5e727e" font-weight="400" >保存进度，交接下一步</text><text x="912" y="369" font-size="15" fill="#147d70" font-weight="600" >过程可见、可恢复</text><path d="M1026 400v35H742v-35" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M737 406l5-6 5 6" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="775" y="416" width="220" height="30" rx="0" fill="#f5f8f8" stroke="none"/><text x="885" y="437" font-size="15" fill="#147d70" font-weight="600" text-anchor="middle">满足条件 → 进入下一步</text><rect x="40" y="417" width="360" height="30" rx="15" fill="#fff0db" stroke="none"/><text x="220" y="437" font-size="13" fill="#ae691b" font-weight="650" text-anchor="middle">证据不足 / 等待外部结果 → 保持当前状态</text><rect x="40" y="473" width="1120" height="84" rx="14" fill="#172c38" stroke="none"/><text x="65" y="508" font-size="21" fill="#fff" font-weight="650" >关闭 Agent，也能接着做。</text><text x="65" y="536" font-size="17" fill="#c6d9df" font-weight="400" >检查点保存在任务工作区；恢复同一实例时，保留当前状态、列表进度与等待任务。</text>
</svg>
