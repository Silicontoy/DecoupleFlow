<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="645" viewBox="0 0 1200 645" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Choose an agent. Pick a folder. Install.</title><desc id="desc">No manual Skill packaging. Codex is shown here; Claude Code and Copilot use the same export panel.</desc>
<style>text{font-family:Inter,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="1198" height="643" rx="22" fill="#f5f8f8" stroke="#d9e3e6"/>
<text x="40" y="43" font-size="13" fill="#147d70" font-weight="700" letter-spacing="1.5">DECOUPLEFLOW  /  INSTALL &amp; USE</text>
<text x="40" y="95" font-size="32" fill="#172c38" font-weight="700" >Choose an agent. Pick a folder. Install.</text>
<text x="40" y="133" font-size="18" fill="#5e727e" font-weight="400" >No manual Skill packaging. Codex is shown here; Claude Code and Copilot use the same export panel.</text>
<rect x="40" y="175" width="726" height="405" rx="14" fill="#fff" stroke="#d9e3e6"/><rect x="40" y="175" width="726" height="58" rx="14" fill="#172c38" stroke="none"/><rect x="40" y="207" width="726" height="26" rx="0" fill="#172c38" stroke="none"/><text x="62" y="212" font-size="20" fill="#fff" font-weight="650" >Export / Connect</text><rect x="583" y="190" width="161" height="30" rx="15" fill="#33505c" stroke="none"/><text x="663.5" y="210" font-size="13" fill="#fff" font-weight="650" text-anchor="middle">Agent Skill</text><text x="63" y="270" font-size="18" fill="#172c38" font-weight="650" >1  Choose your agent</text><rect x="63" y="287" width="213" height="50" rx="9" fill="#e7f5ef" stroke="#147d70"/><text x="169" y="318" font-size="18" fill="#147d70" font-weight="600" text-anchor="middle">Codex  ✓</text><rect x="289" y="287" width="213" height="50" rx="9" fill="#fff" stroke="#d9e3e6"/><text x="395" y="318" font-size="18" fill="#5e727e" font-weight="600" text-anchor="middle">Claude Code</text><rect x="515" y="287" width="213" height="50" rx="9" fill="#fff" stroke="#d9e3e6"/><text x="621" y="318" font-size="18" fill="#5e727e" font-weight="600" text-anchor="middle">GitHub Copilot</text><text x="63" y="379" font-size="18" fill="#172c38" font-weight="650" >2  Choose a scope and folder</text><rect x="63" y="395" width="329" height="70" rx="9" fill="#e7f5ef" stroke="#147d70"/><rect x="407" y="395" width="335" height="70" rx="9" fill="#fff" stroke="#d9e3e6"/><text x="80" y="423" font-size="18" fill="#147d70" font-weight="650" >●  Project</text><text x="80" y="448" font-size="15" fill="#5e727e" font-weight="400" >Available in the selected project</text><text x="425" y="423" font-size="18" fill="#172c38" font-weight="600" >○  Personal</text><text x="425" y="448" font-size="15" fill="#5e727e" font-weight="400" >Across projects for the agent user</text><text x="63" y="498" font-size="17" fill="#5e727e" font-weight="500" >.agents/skills/df-demo-bugfix</text><rect x="63" y="520" width="679" height="42" rx="9" fill="#147d70" stroke="none"/><text x="402" y="547" font-size="18" fill="#fff" font-weight="650" text-anchor="middle">3  Install to Codex  →</text><path d="M777 375H804" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M799 370l5 5-5 5" fill="none" stroke="#147d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="824" y="175" width="336" height="405" rx="14" fill="#172c38" stroke="none"/><text x="848" y="213" font-size="24" fill="#fff" font-weight="650" >4  Copy. Paste. Use it.</text><text x="848" y="251" font-size="17" fill="#c6d9df" font-weight="400" >Paste into Codex</text><rect x="844" y="273" width="296" height="102" rx="9" fill="#28434e" stroke="none"/><text x="861" y="308" font-size="21" fill="#9cdeca" font-weight="600" >$df-demo-bugfix</text><text x="861" y="339" font-size="15" fill="#fff" font-weight="400" >Fix the cart in sample/.</text><text x="861" y="362" font-size="15" fill="#fff" font-weight="400" >Keep test and regression evidence.</text><text x="848" y="415" font-size="17" fill="#c6d9df" font-weight="400" >The agent reads the Skill to start.</text><text x="848" y="442" font-size="17" fill="#c6d9df" font-weight="400" >With visualization enabled,</text><text x="848" y="469" font-size="17" fill="#c6d9df" font-weight="400" >the first runtime call opens</text><text x="848" y="496" font-size="17" fill="#c6d9df" font-weight="400" >the live execution view.</text><text x="848" y="550" font-size="16" fill="#9cdeca" font-weight="550" >Install once. Reuse for each task.</text><text x="40" y="615" font-size="16" fill="#5e727e" font-weight="400" >Projects are discovered automatically, or choose a folder. Confirm the destination, then install. ZIP export is also available.</text>
</svg>
